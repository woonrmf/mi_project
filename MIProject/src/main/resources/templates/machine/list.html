<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>기계 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.css" rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="~{main/navbar :: navbar}"></div>

<div class="container-fluid px-5 py-4">

    <h3 class="mb-4">기계 전체 리스트</h3>

    <div class="row">

        <!-- 구역 단위 -->
        <div class="col-md-3 mb-4"
             th:each="entry : ${mMap}">

            <!-- 구역 카드 -->
            <div class="card shadow-sm h-100">
                <div class="card-header bg-dark text-white text-center fw-bold">
                    [[${entry.key}]] 구역
                </div>

                <div class="card-body">

                    <!-- 기계 카드 -->
                    <div class="mb-3"
                         th:each="machine : ${entry.value}">

                        <a th:href="@{/machines/{id}(id=${machine.id})}"
                           class="text-decoration-none text-dark">

                            <div class="border rounded p-3
                                        d-flex justify-content-between align-items-center
                                        hover-shadow">

                                <!-- 기계명 -->
                                <span class="fw-semibold">
                                    [[${machine.name}]]
                                </span>

                                <!-- 상태 -->
                                <span class="badge"
                                      th:classappend="
                                      ${machine.status.name() == 'NORMAL'} ? 'bg-success' :
                                      (${machine.status.name() == 'NEED_INSPECTION'} ? 'bg-warning text-dark' :
                                      'bg-danger')">

                                    [[${machine.status}]]
                                </span>
                            </div>
                        </a>

                    </div>

                    <!-- 기계 없음 -->
                    <div th:if="${#lists.isEmpty(entry.value)}"
                         class="text-muted text-center">
                        등록된 기계 없음
                    </div>

                </div>
            </div>

        </div>

    </div>
</div>

</body>
</html>
