<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>기계 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- 네비바 -->
<div th:replace="~{main/navbar :: navbar}"></div>

<div class="container py-5" style="max-width: 700px">

    <h3 class="mb-4 text-center">기계 상세 정보</h3>

    <!-- 기계 정보 카드 -->
    <div class="card shadow mb-4">
        <div class="card-body">

            <div class="row mb-3">
                <div class="col-3 fw-bold">기계명</div>
                <div class="col-9" th:text="${machine.name}"></div>
            </div>

            <div class="row mb-3">
                <div class="col-3 fw-bold">기계 코드</div>
                <div class="col-9" th:text="${machine.mCode}"></div>
            </div>

            <div class="row mb-3">
                <div class="col-3 fw-bold">설치 위치</div>
                <div class="col-9" th:text="${machine.location}"></div>
            </div>

            <div class="row">
                <div class="col-3 fw-bold">상태</div>
                <div class="col-9">
                    <span class="badge bg-success"
                          th:if="${machine.status.name() == 'NORMAL'}">
                        정상
                    </span>
                    <span class="badge bg-warning text-dark"
                          th:if="${machine.status.name() != 'NORMAL'}">
                        점검 필요
                    </span>
                </div>
            </div>

        </div>
    </div>

    <!-- 관리자: 기계 정보 수정 -->
    <div class="card shadow mb-4"
         sec:authorize="hasRole('ADMIN')">
        <div class="card-body">
            <h5 class="mb-3">기계 정보 수정</h5>

            <form th:action="@{/machines/admin/{id}(id=${machine.id})}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label">기계명</label>
                    <input type="text"
                           name="name"
                           th:value="${machine.name}"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">설치 위치</label>
                    <input type="text"
                           name="location"
                           th:value="${machine.location}"
                           class="form-control">
                </div>

                <button class="btn btn-primary">
                    정보 수정
                </button>
            </form>
        </div>
    </div>

    <!-- 관리자: 점검 요청 -->
    <div class="card shadow mb-4"
         sec:authorize="hasRole('ADMIN')">
        <div class="card-body">
            <h5 class="mb-3">점검 관리</h5>

            <div th:if="${machine.status.name() == 'NORMAL'}">
                <form th:action="@{/machines/admin/{id}/request(id=${machine.id})}"
                      method="post">
                    <button class="btn btn-danger">
                        점검 요청
                    </button>
                </form>
            </div>

            <div th:if="${machine.status.name() != 'NORMAL'}"
                 class="text-muted">
                현재 상태에서는 점검 요청이 불가능합니다.
            </div>
        </div>
    </div>

    <!-- 목록 이동 -->
    <div class="text-center">
        <a th:href="@{/machines/list}" class="text-decoration-none">
            ← 기계 목록으로
        </a>
    </div>

</div>

</body>
</html>
