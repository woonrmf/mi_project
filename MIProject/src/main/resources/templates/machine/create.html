<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>기계 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.css" rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="~{main/navbar :: navbar}"></div>

<div class="container py-5" style="max-width: 500px">

    <h3 class="text-center mb-4">기계 등록</h3>

    <div class="card shadow">
        <div class="card-body">

            <form th:action="@{/machines/admin/create}"
                  method="post"
                  th:object="${machineRequestDto}">

                <div class="mb-3">
                    <label class="form-label">기계명</label>
                    <input type="text"
                           th:field="*{name}"
                           class="form-control"
                           placeholder="예: 머신 A-1"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">기계 코드</label>
                    <input type="text"
                           th:field="*{mCode}"
                           class="form-control"
                           placeholder="예: MC-001"
                           required>
                </div>

                <div class="mb-4">
                    <label class="form-label">설치 위치</label>
                    <input type="text"
                           th:field="*{location}"
                           class="form-control"
                           placeholder="예: 1공장 a라인">
                </div>

                <div class="d-grid">
                    <button class="btn btn-primary">
                        기계 등록
                    </button>
                </div>
            </form>

        </div>
    </div>

    <div class="text-center mt-3">
        <a th:href="@{/machines/list}" class="text-decoration-none">
            ← 기계 목록으로
        </a>
    </div>

</div>

</body>
</html>
