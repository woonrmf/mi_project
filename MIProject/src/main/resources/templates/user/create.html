<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>회원가입</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5" style="max-width: 500px">

    <h3 class="text-center mb-4">사용자 등록</h3>

    <div class="card shadow">
        <div class="card-body">

            <form th:action="@{/users}" method="post" th:object="${userRequestDto}">
                <div class="mb-3">
                    <label class="form-label">로그인 ID</label>
                    <input type="text" th:field="*{loginId}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">비밀번호</label>
                    <input type="password" th:field="*{password}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">이름</label>
                    <input type="text" th:field="*{name}" class="form-control">
                </div>

                <div class="mb-4">
                    <label class="form-label">권한</label>
                    <select th:field="*{role}" class="form-select">
                        <option value="ADMIN">관리자</option>
                        <option value="INSPECTOR">점검자</option>
                        <option value="REPAIR">수리자</option>
                    </select>
                </div>

                <div class="d-grid">
                    <button class="btn btn-primary">등록</button>
                </div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
