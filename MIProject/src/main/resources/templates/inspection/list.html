<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>점검 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.css" rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="~{main/navbar :: navbar}"></div>

<div class="container py-5">

    <h3 class="mb-4">점검 목록</h3>

    <div class="alert alert-info"
         th:if="${#lists.isEmpty(list)}">
        현재 진행 중인 점검이 없습니다.
    </div>

    <div class="row">
        <div class="col-md-4 mb-4"
             th:each="inspection : ${list}">

            <div class="card shadow h-100">

                <div class="card-body">
                    <h5 th:text="${inspection.machineName}"></h5>

                    <p class="small text-muted">
                        위치: [[${inspection.machineLocation}]]
                    </p>

                    <!-- 상태 -->
                    <span class="badge bg-secondary"
                          th:if="${inspection.status.name() == 'READY'}">
                        점검 대기
                    </span>

                    <span class="badge bg-primary"
                          th:if="${inspection.status.name() == 'IN_PROGRESS'}">
                        점검 중
                    </span>

                    <span class="badge bg-success"
                          th:if="${inspection.status.name() == 'COMPLETED'}">
                        점검 완료
                    </span>
                </div>

                <div class="card-footer bg-white border-0 text-end">
                    <a th:href="@{/inspections/{id}(id=${inspection.id})}"
                       class="btn btn-sm btn-outline-primary">
                        상세 보기
                    </a>
                </div>

            </div>
        </div>
    </div>

</div>

</body>
</html>
