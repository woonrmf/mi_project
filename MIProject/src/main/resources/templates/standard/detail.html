<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>기준 상세</title>
</head>
<body>
    <h1>기준 상세</h1>
    <p>ID: <span th:text="${standard.id}"></span></p>
    <p>이름: <span th:text="${standard.name}"></span></p>
    <p>메모: <span th:text="${standard.memo}"></span></p>

    <h2>수정</h2>
    <form th:action="@{/standards/{id}(id=${standard.id})}" method="post">
        <label>이름: <input type="text" name="name" th:value="${standard.name}"/></label><br/>
        <label>메모: <input type="text" name="memo" th:value="${standard.memo}"/></label><br/>
        <button type="submit">수정</button>
    </form>

    <p><a th:href="@{/standards/list}">리스트로 돌아가기</a></p>
</body>
</html>
