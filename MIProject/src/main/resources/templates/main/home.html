<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>기계 설비 점검</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <!-- ================= 로그인 전 ================= -->
    <div th:if="${!login}">
        <h1 class="text-center mb-5">기계 설비 점검</h1>

        <div class="row align-items-center">
            <!-- 좌측 이미지 -->
            <div class="col-md-6 text-center">
                <img src="/images/main1.jpg"
                     class="img-fluid rounded shadow"
                     style="height:800px; object-fit:cover;"
                     alt="factory">
            </div>

            <!-- 우측 로그인 -->
            <div class="col-md-6">
                <div class="card shadow p-4 mx-auto" style="max-width:400px;">
                    <h4 class="mb-4 text-center">로그인</h4>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <input type="text"
                                   name="username"
                                   class="form-control"
                                   placeholder="아이디"
                                   required>
                        </div>

                        <div class="mb-3">
                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="비밀번호"
                                   required>
                        </div>

                        <div th:if="${param.error}" class="text-danger mb-3 text-center">
                            아이디 또는 비밀번호가 올바르지 않습니다.
                        </div>

                        <div class="d-grid mb-3">
                            <button class="btn btn-primary">로그인</button>
                        </div>
                    </form>

                    <div class="text-center">
                        <a href="/users/create" class="btn btn-outline-secondary btn-sm">
                            회원가입
                        </a>
                    </div>
                </div>

                <!-- 우측 하단 이미지 -->
                <div class="text-center mt-4">
                    <img src="/images/main2.jpg"
                         class="img-fluid rounded shadow"
                         style="height:350px; object-fit:cover;"
                         alt="factory2">
                </div>
            </div>
        </div>
    </div>

    <!-- ================= 로그인 후 ================= -->
    <div th:if="${login}">

        <!-- 상단 바 -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4>
                    👤 <span sec:authentication="principal.username"></span>
                    (<span sec:authentication="principal.authorities"></span>)
                </h4>
            </div>

            <div>
                <!-- 관리자 -->
                <a sec:authorize="hasRole('ADMIN')"
                   href="/machines/admin/create"
                   class="btn btn-success me-2">
                    ➕ 기계 등록
                </a>

                <!-- 점검자 -->
                <a sec:authorize="hasRole('INSPECTOR')"
                   href="/inspections/list"
                   class="btn btn-warning me-2">
                    🔍 점검 대기 목록
                </a>

                <form th:action="@{/logout}" method="post" class="d-inline">
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">
                    <button class="btn btn-outline-danger">
                        로그아웃
                    </button>
                </form>
            </div>
        </div>

        <!-- 로그인 성공 알림 -->
        <div class="alert alert-success">
            로그인 성공 ✔ 설비 현황을 확인하세요.
        </div>

        <!-- 기계 없을 때 -->
        <div th:if="${#maps.isEmpty(mMap)}"
             class="alert alert-warning">
            ⚠ 등록된 기계가 없습니다.
        </div>

        <!-- 기계 현황 -->
        <div th:each="entry : ${mMap}">
            <h4 class="mt-4">구역 [[${entry.key}]]</h4>

            <div class="row">
                <div class="col-md-3 mb-3"
                     th:each="machine : ${entry.value}">
                    <div class="card shadow-sm h-100">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${machine.name}"></h5>

                            <p class="card-text">
                                코드: <span th:text="${machine.mCode}"></span><br>
                                상태:
                                <span th:text="${machine.status}"
                                      th:classappend="
                                      ${machine.status.name() == 'NORMAL'} ? 'text-success' :
                                      (${machine.status.name() == 'NEED_INSPECTION'} ? 'text-warning' :
                                      'text-danger')">
                                </span>
                            </p>

                            <a th:href="@{/machines/{id}(id=${machine.id})}"
                               class="btn btn-sm btn-outline-primary">
                                상세 보기
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
