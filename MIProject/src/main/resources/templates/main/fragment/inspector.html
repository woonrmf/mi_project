<div th:fragment="inspector">

    <h3 class="mb-4">점검 대상 기계</h3>

    <div class="alert alert-info"
         th:if="${#maps.isEmpty(mMap)}">
        점검 대상 기계가 없습니다.
    </div>

    <div th:each="entry : ${mMap}">
        <h5 class="mt-4">📍 [[${entry.key}]]</h5>

        <div class="row">
            <div class="col-md-4 mb-3"
                 th:each="machine : ${entry.value}"
                 th:if="${machine.status.name() == 'NEED_INSPECTION' 
                      or machine.status.name() == 'INSPECTION'}">

                <div class="card border-warning shadow-sm h-100">
                    <div class="card-body">
                        <h6 th:text="${machine.name}"></h6>

                        <p class="small text-muted">
                            코드: [[${machine.mCode}]]<br>
                            기계 상태: [[${machine.status}]]
                        </p>

                        <!-- 🔴 점검중 -->
                        <button class="btn btn-sm btn-secondary"
                                th:if="${machine.inspectionStatus?.name() == 'IN_PROGRESS'}"
                                disabled>
                            점검중
                        </button>

                        <!-- 🟡 점검 생성 완료 (READY) -->
                        <button class="btn btn-sm btn-secondary"
                                th:if="${machine.inspectionStatus?.name() == 'READY'}"
                                disabled>
                            점검 생성 완료
                        </button>

                        <!-- 🟢 점검 생성 가능 -->
                        <form th:if="${machine.inspectionStatus == null}"
                              th:action="@{/inspections/create/{id}(id=${machine.id})}"
                              method="post">
                            <button class="btn btn-sm btn-warning">
                                점검 생성
                            </button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
