<div th:fragment="admin" class="admin-page">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0 admin-title">
            기계 상태 현황
            <span class="badge bg-dark ms-2">ADMIN</span>
        </h3>

        <a href="/machines/admin/create"
           class="btn btn-primary btn-sm shadow-sm">
            ➕ 기계 등록
        </a>
    </div>

    <div class="row mb-4">
        <!-- 총 기계 수 -->
        <div class="col-md-3">
            <div class="card shadow-sm admin-card">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted small">총 기계 수</div>
                        <h4 class="fw-bold mb-0">
                            [[${totalCount} ?: '-']]
                        </h4>
                    </div>
                    <div class="admin-summary-icon text-primary">⚙</div>
                </div>
            </div>
        </div>

        <!-- 정상 -->
        <div class="col-md-3">
            <div class="card shadow-sm admin-card">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted small">정상</div>
                        <h4 class="fw-bold text-success mb-0">
                            [[${normalCount} ?: '-']]
                        </h4>
                    </div>
                    <div class="admin-summary-icon text-success">🟢</div>
                </div>
            </div>
        </div>

        <!-- 점검 필요 -->
        <div class="col-md-3">
            <div class="card shadow-sm admin-card">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted small">점검 필요</div>
                        <h4 class="fw-bold text-warning mb-0">
                            [[${inspectionCount} ?: '-']]
                        </h4>
                    </div>
                    <div class="admin-summary-icon text-warning">🟠</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 기계 없을 때 -->
    <div th:if="${#maps.isEmpty(mMap)}"
         class="alert empty-box shadow-sm">
        ⚠ 등록된 기계가 없습니다.
    </div>

    <!-- 구역별 기계 리스트 -->
    <div th:each="entry : ${mMap}"
         class="card shadow-sm mb-4 border-0 admin-card">

        <div class="card-header fw-bold area-header">
            📍 구역 : [[${entry.key}]]
        </div>

        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle machine-table">
                <thead class="table-light">
                <tr>
                    <th>기계명</th>
                    <th>코드</th>
                    <th>상태</th>
                    <th class="text-center">관리</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="machine : ${entry.value}">
                    <td class="fw-semibold" th:text="${machine.name}"></td>
                    <td th:text="${machine.mCode}"></td>

                    <td>
                        <span class="badge badge-status px-3 py-2"
                              th:text="${machine.status}"
                              th:classappend="
                                ${machine.status.name() == 'NORMAL'} ? 'badge-normal' :
                                (${machine.status.name() == 'NEED_INSPECTION'} ? 'badge-inspection' :
                                'badge-etc')">
                        </span>
                    </td>

                    <td class="text-center">
                        <form th:if="${machine.status.name() == 'NORMAL'}"
                              th:action="@{/machines/admin/{id}/request(id=${machine.id})}"
                              method="post"
                              class="d-inline">

                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">

                            <button class="btn btn-sm btn-outline-warning btn-inspection">
                                🔧 점검 요청
                            </button>
                        </form>

                        <span th:if="${machine.status.name() != 'NORMAL'}"
                              class="badge bg-secondary">
                            처리 중
                        </span>

                        <a th:href="@{/machines/{id}(id=${machine.id})}"
                           class="btn btn-sm btn-outline-secondary ms-2">
                            상세
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
