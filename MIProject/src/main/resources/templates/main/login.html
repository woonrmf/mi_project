<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>W_Factory</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Segoe UI', 'Noto Sans KR', sans-serif;
        }

        /* 배경 이미지 */
        .login-bg {
            min-height: 100vh;
            background: url('/images/main3.jpg') no-repeat center center;
            background-size: cover;
        }

        .login-overlay {
            min-height: 100vh;
            background: rgba(15, 23, 42, 0.65);
        }

        .login-card {
            width: 480px;
            border-radius: 14px;
            overflow: hidden;
        }

        .login-image {
            height: 160px;
            background: url('/images/main1.jpg') no-repeat center center;
            background-size: cover;
        }
    </style>
</head>

<body>
	<div th:replace="main/navbar :: navbar"></div>
	<div class="login-bg">
	    <div class="login-overlay d-flex justify-content-center align-items-center">
	        <div class="card login-card shadow-lg">
	            <div class="login-image"></div>
	            <div class="p-4">
	                <div class="mb-4 text-center">
	                    <h3 class="fw-bold mb-1">W_Factory</h3>
	                    <div class="text-muted small">
	                        안녕하세요 W_Factory입니다.
	                    </div>
	                </div>
	
	                <form th:action="@{/login}" method="post">
	                    <div class="mb-3">
	                        <label class="form-label small text-muted">아이디</label>
	                        <input type="text"
	                               name="username"
	                               class="form-control"
	                               placeholder="아이디"
	                               required>
	                    </div>
	                    <div class="mb-3">
	                        <label class="form-label small text-muted">비밀번호</label>
	                        <input type="password"
	                               name="password"
	                               class="form-control"
	                               placeholder="비밀번호"
	                               required>
	                    </div>
	                    <div th:if="${param.error}"
	                         class="alert alert-danger py-2 small text-center">
	                        아이디 또는 비밀번호가 올바르지 않습니다.
	                    </div>
	                    <div class="d-grid mt-4">
	                        <button class="btn btn-primary btn-lg">
	                            로그인
	                        </button>
	                    </div>
	                </form>
	
	                <div class="text-center mt-4 small">
	                    <a href="/users/create" class="text-decoration-none">
	                        회원가입
	                    </a>
	                </div>
	
	            </div>
	        </div>
	
	    </div>
	</div>
</body>
</html>
