<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

<div class="container d-flex justify-content-center align-items-center"
     style="height: 100vh; max-width: 400px">

    <div class="card shadow w-100">
        <div class="card-body text-dark">

            <h4 class="text-center mb-4">설비 점검 시스템</h4>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <input name="username" class="form-control" placeholder="로그인 ID">
                </div>

                <div class="mb-3">
                    <input type="password" name="password" class="form-control" placeholder="비밀번호">
                </div>

                <div th:if="${param.error}" class="alert alert-danger">
                    로그인 정보가 올바르지 않습니다.
                </div>

                <div class="d-grid">
                    <button class="btn btn-primary">로그인</button>
                </div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
